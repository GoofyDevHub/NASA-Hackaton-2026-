<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORBIT — Earth in Tune</title>
  <meta name="description" content="An accessible listening guide to three NASA Earth visualizations.">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="entrance">
  <canvas id="globe" aria-hidden="true"></canvas>
  <div id="pins"></div>
  <div id="callout" aria-hidden="true" hidden>
    <p class="c-title"></p>
    <p class="c-sub"></p>
    <span class="c-open">Open content <span class="arrow">→</span></span>
  </div>
  <div id="callout-line" aria-hidden="true" hidden></div>

  <header class="top">
    <p class="brand">ORBIT <span class="dash">—</span> <em>Earth in Tune</em></p>
    <nav class="crumbs" aria-label="Breadcrumb">
      <button id="crumb-explore" type="button">Explore</button><span aria-hidden="true">/</span><span aria-current="page">Player</span>
    </nav>
  </header>

  <p id="live" class="sr-only" role="status" aria-live="polite"></p>

  <main>
    <!-- 1. Entrance -->
    <section id="entrance" aria-labelledby="hero-title">
      <h1 id="hero-title">Earth has<br>something<br>to tell you.</h1>
      <p class="lead">Choose a place. Hear a different perspective.</p>
      <button id="explore" class="cta" type="button">Explore on Earth <span class="arrow">→</span></button>
    </section>

    <!-- 2. Globe -->
    <section id="explorer" aria-label="Explore the globe" hidden>
      <h1 class="sr-only">Choose a place on the globe</h1>
      <div class="actions">
        <button id="tour" class="pill primary" type="button"><svg viewBox="0 0 20 22"><path d="M2 1l17 10L2 21z" fill="currentColor"/></svg>Start tour</button>
        <button id="list" class="pill" type="button" aria-haspopup="dialog"><svg viewBox="0 0 30 28"><path d="M15 2 28 8.5 15 15 2 8.5zM2 14l13 6.5L28 14M2 19.5 15 26l13-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Content list</button>
      </div>
    </section>

    <!-- 3. Player -->
    <section id="player" aria-labelledby="p-title" hidden>
      <div class="card">
        <figure class="shot">
          <img id="p-image" alt="">
          <figcaption id="p-tag"></figcaption>
        </figure>
        <div class="body">
          <button id="p-close" type="button" aria-label="Close player">✕</button>
          <p class="state"><span id="p-lamp" aria-hidden="true"></span><span id="p-status">Ready to listen</span><span id="p-tour" class="tour" hidden></span></p>
          <h1 id="p-title" tabindex="-1"></h1>
          <p id="p-sub" class="sub"></p>
          <p id="p-desc" class="sr-only"></p>

          <div class="transport">
            <button id="p-listen" class="primary" type="button"></button>
            <button id="p-stop" class="outline" type="button"><span class="ico-stop" aria-hidden="true"></span>Stop</button>
          </div>
          <button id="p-describe" class="textlink" type="button">Listen to the description</button>

          <hr>
          <div class="options">
            <label class="check"><input id="p-repeat" type="checkbox"><span class="box" aria-hidden="true"></span>Repeat image</label>
            <label class="volume" for="p-volume">Volume <input id="p-volume" type="range" min="0" max="100" step="5" value="80"></label>
          </div>
          <div class="steps">
            <button id="p-prev" type="button"><span class="arrow">←</span> Previous</button>
            <button id="p-next" type="button">Next <span class="arrow">→</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <dialog id="contents" aria-labelledby="contents-title">
    <div class="contents-head">
      <h2 id="contents-title">Content list</h2>
      <button id="contents-close" type="button" aria-label="Close content list">✕</button>
    </div>
    <div id="contents-body"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
